<!doctype html>
<html lang="pt-BR" class="dark" data-accent="teal" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <title>Core Learn</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("core-learn-appearance");
          var accent = "teal";
          var density = "comfortable";
          var densities = { spacious: 1, comfortable: 1, compact: 1, dense: 1 };
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.accent) accent = parsed.accent;
            if (parsed.density && densities[parsed.density]) density = parsed.density;
          }
          var root = document.documentElement;
          root.classList.add("dark");
          root.removeAttribute("data-theme");
          root.setAttribute("data-accent", accent);
          root.setAttribute("data-density", density);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
